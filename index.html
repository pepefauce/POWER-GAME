    <!-- LÓGICA Y CONEXIÓN A D1 -->
    <script>
        const DAPP_PRINCIPAL_URL = "https://multiswap-power-flow.pages.dev";
        const API_D1_URL = "https://multiswap-power-flow.pages.dev/api/game";

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let isRunning = false;
        let score = 0, gems = 0, level = 1, xp = 0, xpToNext = 5, secondsSurvived = 0;
        let survivalInterval = null;
        let player, bullets, enemies, gemsList;
        let touchX = null, touchY = null;

        let playerStats = { speed: 4, fireRate: 350, lastShootTime: 0, bulletDamage: 1, bulletSpeed: 7, health: 100, magnetRadius: 90 };

        function exitToMainDapp() { window.location.href = DAPP_PRINCIPAL_URL; }

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }

        window.addEventListener("resize", resizeCanvas);

        document.addEventListener("DOMContentLoaded", () => {
            resizeCanvas();

            const urlParams = new URLSearchParams(window.location.search);
            const walletParam = urlParams.get("wallet");
            const expiryParam = urlParams.get("expiry");

            if (walletParam && expiryParam) {
                localStorage.setItem("game_wallet", walletParam.toLowerCase());
                localStorage.setItem("game_expiry", expiryParam);
                try { window.history.replaceState({}, document.title, window.location.pathname); } catch(e){}
            }

            const storedExpiry = localStorage.getItem("game_expiry");
            const timerEl = document.getElementById("timerDisplay");

            if (storedExpiry) {
                const diff = parseInt(storedExpiry) - Date.now();
                if (diff > 0) {
                    const hrs = Math.floor(diff / (1000 * 60 * 60));
                    const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    if (timerEl) timerEl.innerText = `Pase Activo: ${hrs}h ${mins}m`;
                } else {
                    alert("🔒 Tu pase ha expirado. Renueva tu entrada en la dApp.");
                    localStorage.removeItem("game_expiry");
                    window.location.href = DAPP_PRINCIPAL_URL;
                    return;
                }
            } else {
                if (timerEl) timerEl.innerText = `Prueba Libre`;
            }

            setupControls();
            loadD1Data();
        });

        // LEER POZO Y LEADERBOARD DESDE D1
        async function loadD1Data() {
            try {
                const res = await fetch(API_D1_URL, { method: "GET", headers: { "Accept": "application/json" } });
                const data = await res.json();

                if (data.prizePool !== undefined) {
                    document.getElementById("prizePoolDisplay").innerText = `${Number(data.prizePool).toLocaleString()} FLOW`;
                } else {
                    document.getElementById("prizePoolDisplay").innerText = "1,000 FLOW";
                }

                const listEl = document.getElementById("leaderboardList");
                if (data.leaderboard && data.leaderboard.length > 0) {
                    listEl.innerHTML = "";
                    data.leaderboard.forEach((item, index) => {
                        const shortWallet = `${item.wallet.substring(0, 6)}...${item.wallet.substring(item.wallet.length - 4)}`;
                        listEl.innerHTML += `
                            <div class="flex justify-between text-slate-300 font-mono text-xs">
                                <span>${index + 1}. ${shortWallet}</span>
                                <span class="text-emerald-400 font-bold">${Number(item.high_score).toLocaleString()} pts</span>
                            </div>
                        `;
                    });
                } else {
                    listEl.innerHTML = "<p class='text-slate-500 text-center'>Sé el primero en calificar esta semana.</p>";
                }
            } catch (err) {
                console.error("Error conectando con D1:", err);
                document.getElementById("prizePoolDisplay").innerText = "1,000 FLOW";
                document.getElementById("leaderboardList").innerHTML = "<p class='text-rose-400 text-center'>Error al sincronizar D1</p>";
            }
        }

        // GUARDAR PUNTAJE AL MORIR (CORREGIDO Y ROBUSTO)
        async function saveScoreToD1(finalScore) {
            const statusEl = document.getElementById("scoreSyncStatus");
            
            // Busca la wallet en la URL o en CUALQUIER clave de localStorage que uses
            const urlParams = new URLSearchParams(window.location.search);
            let wallet = urlParams.get("wallet") || 
                         localStorage.getItem("flow_active_wallet") || 
                         localStorage.getItem("game_wallet");

            if (wallet) {
                wallet = wallet.toLowerCase().trim();
                localStorage.setItem("game_wallet", wallet);
            }

            if (!wallet) {
                statusEl.innerText = "⚠️ No se detectó Wallet conectada";
                console.error("Error: No se encontró la wallet del jugador.");
                return;
            }

            try {
                statusEl.innerText = "Guardando récord en D1...";
                const response = await fetch(API_D1_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        wallet: wallet, 
                        score: finalScore 
                    })
                });
                
                const result = await response.json();
                if (response.ok && result.success) {
                    statusEl.innerText = "✅ ¡Récord sincronizado con D1!";
                } else {
                    statusEl.innerText = "⚠️ " + (result.error || "Error al actualizar récord.");
                }
                loadD1Data();
            } catch (e) {
                console.error("Error de red al guardar puntaje:", e);
                statusEl.innerText = "⚠️ Error de red al sincronizar con D1.";
            }
        }

        function setupControls() {
            canvas.addEventListener("touchstart", (e) => {
                const t = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                touchX = t.clientX - rect.left;
                touchY = t.clientY - rect.top;
            });

            canvas.addEventListener("touchmove", (e) => {
                e.preventDefault();
                const t = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                touchX = t.clientX - rect.left;
                touchY = t.clientY - rect.top;
            });

            canvas.addEventListener("touchend", () => { touchX = null; touchY = null; });
        }

        function startGame() {
            document.getElementById("startOverlay").classList.add("hidden");
            document.getElementById("gameOverOverlay").classList.add("hidden");
            document.getElementById("upgradeOverlay").classList.add("hidden");

            score = 0; gems = 0; level = 1; xp = 0; xpToNext = 5; secondsSurvived = 0;
            playerStats = { speed: 4, fireRate: 350, lastShootTime: 0, bulletDamage: 1, bulletSpeed: 7, health: 100, magnetRadius: 90 };

            player = { x: canvas.width / 2, y: canvas.height / 2, radius: 14 };
            bullets = []; enemies = []; gemsList = [];

            isRunning = true;
            updateUI();

            if (survivalInterval) clearInterval(survivalInterval);
            survivalInterval = setInterval(() => {
                if (isRunning) {
                    secondsSurvived++;
                    score += 10;
                    const mins = String(Math.floor(secondsSurvived / 60)).padStart(2, '0');
                    const secs = String(secondsSurvived % 60).padStart(2, '0');
                    document.getElementById("survivalTimer").innerText = `${mins}:${secs}`;
                    updateUI();
                }
            }, 1000);

            requestAnimationFrame(gameLoop);
        }

        function gameLoop(timestamp) {
            if (!isRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (touchX !== null && touchY !== null) {
                const dx = touchX - player.x;
                const dy = touchY - player.y;
                const dist = Math.hypot(dx, dy);
                if (dist > 5) {
                    player.x += (dx / dist) * playerStats.speed;
                    player.y += (dy / dist) * playerStats.speed;
                }
            }

            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

            ctx.save();
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#10b981";
            ctx.shadowColor = "#10b981";
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.restore();

            if (timestamp - playerStats.lastShootTime > playerStats.fireRate) {
                shootNearestEnemy();
                playerStats.lastShootTime = timestamp;
            }

            if (Math.random() < 0.03 + (secondsSurvived * 0.0005)) spawnEnemy();

            bullets.forEach((b, index) => {
                b.x += b.vx; b.y += b.vy;
                ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = "#38bdf8"; ctx.fill();
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) bullets.splice(index, 1);
            });

            enemies.forEach((e, index) => {
                const dx = player.x - e.x, dy = player.y - e.y, dist = Math.hypot(dx, dy);
                e.x += (dx / dist) * e.speed; e.y += (dy / dist) * e.speed;

                ctx.save(); ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fillStyle = e.color; ctx.shadowColor = e.color; ctx.shadowBlur = 8; ctx.fill(); ctx.restore();

                if (dist < player.radius + e.radius) {
                    playerStats.health -= e.damage;
                    enemies.splice(index, 1);
                    if (playerStats.health <= 0) endGame();
                }

                bullets.forEach((b, bIndex) => {
                    if (Math.hypot(b.x - e.x, b.y - e.y) < e.radius + 4) {
                        e.health -= playerStats.bulletDamage;
                        bullets.splice(bIndex, 1);
                        if (e.health <= 0) {
                            enemies.splice(index, 1);
                            gemsList.push({ x: e.x, y: e.y, value: e.xpValue });
                            score += e.scoreValue;
                        }
                    }
                });
            });

            gemsList.forEach((g, index) => {
                const dx = player.x - g.x, dy = player.y - g.y, dist = Math.hypot(dx, dy);
                if (dist < playerStats.magnetRadius) { g.x += (dx / dist) * 6; g.y += (dy / dist) * 6; }
                ctx.beginPath(); ctx.arc(g.x, g.y, 4, 0, Math.PI * 2); ctx.fillStyle = "#fbbf24"; ctx.fill();
                if (dist < player.radius + 4) {
                    gems += g.value; score += g.value * 50; xp += g.value;
                    if (xp >= xpToNext) { xp = 0; level++; xpToNext = Math.round(xpToNext * 1.5); triggerUpgradeMenu(); }
                    gemsList.splice(index, 1); updateUI();
                }
            });

            requestAnimationFrame(gameLoop);
        }

        function shootNearestEnemy() {
            if (enemies.length === 0) return;
            let nearest = null, minDist = Infinity;
            enemies.forEach(e => {
                const dist = Math.hypot(e.x - player.x, e.y - player.y);
                if (dist < minDist) { minDist = dist; nearest = e; }
            });
            if (nearest) {
                const angle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
                bullets.push({ x: player.x, y: player.y, vx: Math.cos(angle) * playerStats.bulletSpeed, vy: Math.sin(angle) * playerStats.bulletSpeed });
            }
        }

        function spawnEnemy() {
            const side = Math.floor(Math.random() * 4);
            let x, y;
            if (side === 0) { x = Math.random() * canvas.width; y = -20; }
            else if (side === 1) { x = canvas.width + 20; y = Math.random() * canvas.height; }
            else if (side === 2) { x = Math.random() * canvas.width; y = canvas.height + 20; }
            else { x = -20; y = Math.random() * canvas.height; }

            const isHard = Math.random() > 0.8;
            enemies.push({ x: x, y: y, radius: isHard ? 14 : 9, speed: isHard ? 1.2 : 2.0, health: isHard ? 3 : 1, damage: isHard ? 25 : 10, color: isHard ? "#f43f5e" : "#e11d48", scoreValue: isHard ? 50 : 20, xpValue: isHard ? 3 : 1 });
        }

        function updateUI() {
            document.getElementById("scoreCount").innerText = score;
            document.getElementById("gemCount").innerText = gems;
        }

        function triggerUpgradeMenu() {
            isRunning = false;
            const overlay = document.getElementById("upgradeOverlay");
            const container = document.getElementById("upgradeOptions");
            overlay.classList.remove("hidden");
            container.innerHTML = "";

            const options = [
                { title: "🚀 Veloz", desc: "+20% Movimiento", apply: () => playerStats.speed += 0.8 },
                { title: "⚡ Cadencia", desc: "-25% Recarga", apply: () => playerStats.fireRate = Math.max(120, playerStats.fireRate * 0.75) },
                { title: "💥 Potencia", desc: "+50% Daño", apply: () => playerStats.bulletDamage += 1 }
            ];

            options.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-left flex flex-col";
                btn.innerHTML = `<span class="font-bold text-emerald-400 text-xs">${opt.title}</span><span class="text-[10px] text-slate-300 mt-0.5">${opt.desc}</span>`;
                btn.onclick = () => { opt.apply(); overlay.classList.add("hidden"); isRunning = true; requestAnimationFrame(gameLoop); };
                container.appendChild(btn);
            });
        }

        function endGame() {
            isRunning = false;
            clearInterval(survivalInterval);
            document.getElementById("finalScore").innerText = score;
            document.getElementById("gameOverOverlay").classList.remove("hidden");

            // Sincronizar el puntaje con Cloudflare D1
            saveScoreToD1(score);
        }
    </script>
